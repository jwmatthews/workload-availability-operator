# Runtime objects WAO applies when the component is enabled: Deployment, Services and ConfigMaps.
# FAR has no webhook configuration here: the WAO manager serves FAR admission (docs/far-webhooks.md). `make operand-manifests` builds this, drops every other kind, and writes
# internal/operands/manifests/far/objects.yaml. The namespace and image placeholders
# are replaced by the Go renderer at reconcile time.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: __WAO_NAMESPACE__
resources:
  - ../../config/default
# `name` is the upstream image selector. newName/newTag are static WAO placeholders; the Go renderer
# replaces `__WAO_<ENV>__:placeholder` with the RELATED_IMAGE_<...> runtime value at reconcile time.
images:
  - name: quay.io/medik8s/fence-agents-remediation-operator
    newName: __WAO_RELATED_IMAGE_FAR_MANAGER__
    newTag: placeholder
# Every operand pod and every Service selector carries the component label (design brief D10):
# all six managers share one namespace and some operand selectors would match other managers.
labels:
  - fields:
      - create: true
        kind: Deployment
        path: spec/template/metadata/labels
      - create: true
        kind: Service
        path: spec/selector
    pairs:
      workloadavailability.medik8s.io/component: fenceAgentsRemediation
patches:
  - path: webhook_cert_patch.yaml
    target:
      kind: Deployment
  - path: webhook_configurations_delete_patch.yaml
    target:
      kind: MutatingWebhookConfiguration
  - path: webhook_configurations_delete_patch.yaml
    target:
      kind: ValidatingWebhookConfiguration
  - path: webhook_service_patch.yaml
    target:
      kind: Service
      name: fence-agents-remediation-webhook-service
