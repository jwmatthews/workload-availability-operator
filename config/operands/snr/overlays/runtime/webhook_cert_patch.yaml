# OpenShift service-ca wiring, which OLM would do for a standalone install. The Service asks
# service-ca for a serving certificate in Secret self-node-remediation-webhook-server-cert; the
# Deployment mounts it where controller-runtime expects it. The unchanged SNR image starts its
# webhook listener and needs these files, although no admission configuration points at it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-node-remediation-controller-manager
spec:
  template:
    spec:
      containers:
      - name: manager
        volumeMounts:
        - name: webhook-server-cert
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
      volumes:
      - name: webhook-server-cert
        secret:
          secretName: self-node-remediation-webhook-server-cert
          defaultMode: 420
