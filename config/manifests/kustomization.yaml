# These resources constitute the fully configured set of manifests
# used to generate the 'manifests/' directory in a bundle.
resources:
- bases/workload-availability-operator.clusterserviceversion.yaml
- ../default
# The FAR admission webhooks that the WAO manager serves. operator-sdk converts them into
# spec.webhookdefinitions of the CSV; see config/webhook/kustomization.yaml.
- ../webhook
- ../samples
- ../scorecard
# Operand RBAC, copied from each operand checkout (config/operands/<k>/config) and wrapped with
# the operand name prefix. operator-sdk folds it into the CSV for the ServiceAccounts listed in
# OPERAND_SERVICE_ACCOUNTS (Makefile); OLM creates it at install. Same pattern as OADP's
# config/non-admin-controller_rbac.
- ../operands/nhc/overlays/rbac
- ../operands/snr/overlays/rbac
- ../operands/sbr/overlays/rbac
- ../operands/far/overlays/rbac
- ../operands/mdr/overlays/rbac
- ../operands/nmo/overlays/rbac

