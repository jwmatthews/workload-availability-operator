apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: workload-availability-operator
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: workload-availability-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: workload-availability-operator
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: workload-availability-operator
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: far-agent-inventory
          # Synchronized from operands.yaml with RELATED_IMAGE_FAR_MANAGER.
          image: quay.io/medik8s/fence-agents-remediation-operator:wao
          imagePullPolicy: Always
          # Override the FAR manager entrypoint. Do not execute fence agents.
          command: ["/bin/sh", "-ec"]
          args:
            - |
              umask 022
              printf 'Inventorying /usr/sbin in the FAR image\n'
              ls -la /usr/sbin > /inventory/usr-sbin.list
              ls -1A /usr/sbin > /inventory/usr-sbin.names
              printf 'Directory entries: '
              wc -l < /inventory/usr-sbin.names
              printf 'Inventory files: /inventory/usr-sbin.list and /inventory/usr-sbin.names\n'
              cat /inventory/usr-sbin.list
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - name: far-agent-inventory
              mountPath: /inventory
      containers:
        - command:
            - /manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=0
          # Operand images must equal repository:tag selected in operands.yaml.
          # They are not configurable through any API field.
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RELATED_IMAGE_NHC_MANAGER
              value: quay.io/medik8s/node-healthcheck-operator:wao
            - name: RELATED_IMAGE_NHC_CONSOLE
              value: quay.io/medik8s/node-remediation-console:wao
            - name: RELATED_IMAGE_SNR_MANAGER
              value: quay.io/medik8s/self-node-remediation-operator:wao
            - name: RELATED_IMAGE_SBR_MANAGER
              value: quay.io/medik8s/storage-based-remediation-operator:wao
            - name: RELATED_IMAGE_SBR_AGENT
              value: quay.io/medik8s/storage-based-remediation-agent:wao
            - name: RELATED_IMAGE_FAR_MANAGER
              value: quay.io/medik8s/fence-agents-remediation-operator:wao
            - name: RELATED_IMAGE_MDR_MANAGER
              value: quay.io/medik8s/machine-deletion-remediation-operator:wao
            - name: RELATED_IMAGE_NMO_MANAGER
              value: quay.io/medik8s/node-maintenance-operator:wao
          image: controller:latest
          name: manager
          ports: []
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          # TODO(user): Configure the resources accordingly based on the project requirements.
          # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: far-agent-inventory
              mountPath: /var/run/wao/far-inventory
              readOnly: true
      volumes:
        - name: far-agent-inventory
          emptyDir: {}
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
